server {
    listen 80;
    server_name 192.168.1.226;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.1.226;

    ssl_certificate     /etc/nginx/ssl/opsone.crt;
    ssl_certificate_key /etc/nginx/ssl/opsone.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /home/opsone/OpsOne/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # ── TENCYBER OAuth Proxy ────────────────────────────────────────────────────
    # Proxy token + userinfo endpoints to avoid CORS issues (browser → our server → TENCYBER)
    location /api/proxy/oauth/ {
        # Handle preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://192.168.1.226" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            return 204;
        }

        proxy_pass https://dashboard.tenfw.com/api/oauth/;
        proxy_ssl_server_name on;
        proxy_set_header Host dashboard.tenfw.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept "application/json";
        proxy_set_header Content-Type $content_type;

        # Pass response Content-Type through correctly
        proxy_pass_header Content-Type;
        proxy_hide_header Access-Control-Allow-Origin;

        # Re-add CORS for our origin
        add_header Access-Control-Allow-Origin "https://192.168.1.226" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Cache static assets aggressively (hashed filenames from vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache public files (logos, icons, fonts)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback — React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
